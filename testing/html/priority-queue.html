<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priority Queue - CampusConnect</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/priority-queue.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div>
        <h1>Priority Queue</h1>
        <p class="subtitle">Sorted by Priority (Urgent → High → Medium → Low) then FIFO creation time</p>
      </div>
      <button type="button" id="reset-data-btn" class="btn btn-secondary">Reset Demo Data</button>
    </header>

    <nav class="page-nav">
      <a href="../../index.html">Dashboard</a>
      <a href="manage-tickets.html">Manage Tickets</a>
      <a href="priority-queue.html" class="active">Priority Queue</a>
      <a href="reports.html">Data &amp; Reports</a>
      <a href="tests.html">Automated Tests</a>
      <a href="matrix.html">Traceability Matrix</a>
    </nav>

    <section class="card">
      <div class="card-header">
        <h2>Pending Resolution Queue</h2>
        <button type="button" id="process-next-btn" class="btn btn-primary">Process Next Ticket</button>
      </div>

      <div id="next-ticket-banner" class="queue-banner"></div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Queue #</th>
              <th>Ticket ID</th>
              <th>Student</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Est. Hours</th>
              <th>Created Time</th>
            </tr>
          </thead>
          <tbody id="queue-table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
