<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data &amp; Reports - CampusConnect</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/reports.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div>
        <h1>Data &amp; Reports</h1>
        <p class="subtitle">Ticket counts by status and estimated backlog hours</p>
      </div>
      <button type="button" id="reset-data-btn" class="btn btn-secondary">Reset Demo Data</button>
    </header>

    <nav class="page-nav">
      <a href="../../index.html">Dashboard</a>
      <a href="manage-tickets.html">Manage Tickets</a>
      <a href="priority-queue.html">Priority Queue</a>
      <a href="reports.html" class="active">Data &amp; Reports</a>
      <a href="tests.html">Automated Tests</a>
      <a href="matrix.html">Traceability Matrix</a>
    </nav>

    <section class="card">
      <h2>Summary Metrics</h2>
      <div class="metrics-grid" style="margin-top: 16px;">
        <div class="metric-card">
          <span class="metric-title">Total Tickets</span>
          <span id="metric-total" class="metric-value">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Pending Queue</span>
          <span id="metric-pending" class="metric-value">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">In Progress</span>
          <span id="metric-progress" class="metric-value">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Resolved Tickets</span>
          <span id="metric-resolved" class="metric-value">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Backlog Workload</span>
          <span id="metric-hours" class="metric-value">0.0 hrs</span>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
